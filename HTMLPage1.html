<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            background: #000010;
        }
    </style>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
          }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Світло від Сонця (в центрі)
        scene.add(new THREE.AmbientLight(0xffffff, 0.2));
        const sunLight = new THREE.PointLight(0xffddaa, 2000);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        // Текстура поверхні Сонця: жовто-помаранчева з плямами
        function makeSunTexture() {
        const w = 1024, h = 512;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');

        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(0, 0, w, h);

        // Малює м'яку пляму; повторюється зліва/справа, щоб не було шва
        function blob(x, y, r, color) {
        for (const dx of [-w, 0, w]) {
        const g = ctx.createRadialGradient(x + dx, y, 0, x + dx, y, r);
        g.addColorStop(0, color);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x + dx - r, y - r, r * 2, r * 2);
        }
        }

        // Дрібна гранульована структура (світліші й темніші плями)
        for (let i = 0; i < 400; i++) {
        const light = Math.random() > 0.5;
        blob(
        Math.random() * w,
        Math.random() * h,
        15 + Math.random() * 40,
        light ? 'rgba(255, 245, 160, 0.35)' : 'rgba(230, 110, 0, 0.35)'
        );
        }

        // Кілька великих темних "сонячних плям"
        for (let i = 0; i < 8; i++) {
        blob(
        Math.random() * w,
        h * 0.3 + Math.random() * h * 0.4,
        20 + Math.random() * 25,
        'rgba(120, 40, 0, 0.8)'
        );
        }

        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
        }

        // Сонце (MeshBasicMaterial не залежить від світла, тому світиться саме)
        const sun = new THREE.Mesh(
        new THREE.SphereGeometry(1, 64, 64),
        new THREE.MeshBasicMaterial({ map: makeSunTexture() })
        );
        scene.add(sun);

        // Сяйво навколо Сонця
        function makeGlowTexture() {
        const c = document.createElement('canvas');
        c.width = c.height = 256;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
        g.addColorStop(0.0, 'rgba(255, 230, 120, 1)');
        g.addColorStop(0.3, 'rgba(255, 170, 0, 0.5)');
        g.addColorStop(1.0, 'rgba(255, 120, 0, 0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 256, 256);
        return new THREE.CanvasTexture(c);
        }

        const glow = new THREE.Sprite(new THREE.SpriteMaterial({
        map: makeGlowTexture(),
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false
        }));
        glow.scale.set(5, 5, 1);
        scene.add(glow);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
        requestAnimationFrame(animate);
        sun.rotation.y += 0.002; // повільне обертання Сонця
        controls.update();
        renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
